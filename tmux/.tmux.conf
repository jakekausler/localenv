# General
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features ",*:mouse"

# ZSH Default Shell
set -g default-shell /bin/zsh

# Remap prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Sane split commands (and open them in the same directory)
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Swap windows with { and }
bind '{' swap-window -t -1 \; select-window -t -1
bind '}' swap-window -t +1 \; select-window -t +1

# Open new window in the same directory
bind c new-window -c "#{pane_current_path}"

# Fast switching (alt-arrow)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Mouse Mode
set -g mouse on

# Easy Reload
bind r source-file ~/.tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Set Clipboard
set-option -g set-clipboard on

# Set escape time for faster nvim
set-option -sg escape-time 10

# Increase history limit
set-option -g history-limit 50000

######################
### DESIGN CHANGES ###
######################

# ---------------------------
#     LAYOUT / STYLE
# ---------------------------
# Install Gruvbox theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark256'

# Status Bar
set -g status-bg colour234

# Hide left/right status sections (keep only window names in the middle)
set -g @tmux-gruvbox-left-status-a ''
set -g @tmux-gruvbox-right-status-x ''
set -g @tmux-gruvbox-right-status-y ''
set -g @tmux-gruvbox-right-status-z ''

# Load Plugins
run '~/.tmux/plugins/tpm/tpm'

# Override plugin status-left/right after it runs so no padding/separators show
set -g status-left ''
set -g status-right ''
set -g status-left-length 0
set -g status-right-length 0

# Get tmux window clicks to work with Claude
unbind -n MouseDown1Status
bind -n MouseUp1Status select-window -t=
bind -n MouseUp1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "select-pane -t=; send-keys -M" "select-pane -t="
